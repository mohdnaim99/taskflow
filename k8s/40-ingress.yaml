# Bonus. Memerlukan ingress controller (cth. ingress-nginx).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8080 } } }
          - path: /swagger
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
